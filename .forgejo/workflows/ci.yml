name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

env:
  # Meme version que le Dockerfile et le hook pre-commit uv-lock.
  UV_VERSION: "0.12.10"

jobs:
  checks:
    name: checks (python ${{ matrix.python-version }})
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        # 3.12 comme le Dockerfile ; 3.10 couvre requires-python.
        python-version: ["3.12", "3.10"]
    steps:
      - uses: actions/checkout@v4

      - name: Installer uv
        run: python3 -m pip install "uv==${UV_VERSION}"

      - name: Installer les dependances
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Verrou a jour
        run: uv lock --check

      - name: Ruff (lint)
        run: uv run --frozen ruff check .

      - name: Ruff (format)
        run: uv run --frozen ruff format --check .

      - name: Mypy
        run: uv run --frozen mypy source tests

      - name: Bandit
        run: uv run --frozen bandit -c pyproject.toml -r source -q

      - name: Pytest (couverture lignes + branches)
        run: uv run --frozen pytest
