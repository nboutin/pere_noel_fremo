<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace Admin - Père Noël de la Frémo</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .admin-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--color-card-border);
        }
        .admin-nav h1 {
            font-size: 1.5rem;
            color: var(--color-gold);
            margin: 0;
        }
        .btn-logout {
            background-color: transparent;
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.5);
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-logout:hover {
            background-color: rgba(239, 68, 68, 0.15);
            border-color: #f87171;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <header class="admin-nav">
            <div>
                <h1>🎅 Espace Admin 🎄</h1>
                <p style="color: var(--color-text-muted); font-size: 0.9rem;">Suivi confidentiel de l'Édition</p>
            </div>
            <form method="post" action="/admin/logout">
                <button type="submit" class="btn-logout">Se déconnecter</button>
            </form>
        </header>

        <section class="card">
            <h2>Bienvenue dans l'Espace Admin</h2>
            <p>Session active et sécurisée.</p>
        </section>
    </div>
</body>
</html>
